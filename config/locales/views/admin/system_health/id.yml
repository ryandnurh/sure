          worker:
            title: Verifikasi worker
            description: Pemeriksaan di atas berjalan dari proses web ini. Sebagian besar pekerjaan AI — respons asisten, pemrosesan PDF, embedding, kategorisasi otomatis, dan deteksi merchant — sebenarnya berjalan di proses worker Sidekiq, yang bisa berbeda dalam akses jaringan, DNS, aturan proxy, atau bahkan kredensial yang dimuat. Antrekan pemeriksaan untuk memverifikasi konfigurasi dan konektivitas worker itu sendiri.
            verify_button: Verifikasi konfigurasi worker
            coverage_notice: Setiap pemeriksaan memverifikasi tepat satu proses worker -- mana pun yang mengambilnya dari antrean. Dengan lebih dari satu replika worker, hasil yang lolos tidak memastikan semua worker sehat; antrekan pemeriksaan lagi untuk mengambil sampel lainnya.
            empty:
              title: Belum ada worker yang check in
              description: Klik "Verify worker configuration" untuk mengantrekan pemeriksaan asinkron. Hasilnya muncul di sini begitu proses worker mengambilnya.
            labels:
              process: Proses worker
              checked_at: Dicentang
              configuration: Konfigurasi
            configuration_statuses:
              match: Cocok dengan web
              mismatch: Berbeda dari web
            statuses:
              passing: Lolos
              failing: Gagal
              stale: Basi
            settings_origin:
              title: Pengaturan mana yang butuh restart?
              database_backed: Pengaturan provider, model, dan API key yang diubah di Pengaturan → Self-Hosting disimpan di database. rails-settings-cached membatalkan cache bersama saat ditulis, jadi web dan worker langsung memakai nilai baru untuk request atau job berikutnya -- tanpa perlu restart.
              env_backed: Konfigurasi embedding, dan nilai apa pun yang hanya diatur lewat environment variable, ditetapkan saat setiap container dimulai. Rails tidak bisa mengubah environment container lain, jadi mengubahnya perlu me-restart atau membuat ulang layanan web dan worker -- dan tool deployment apa pun yang hanya me-restart salah satunya (rollout parsial, Secret yang diperbarui tanpa restart pod) tidak akan menangkap perubahan ini.
          local_setup:
            title: Pengaturan lokal yang disarankan
            description: Jalankan LLM lewat endpoint lokal yang kompatibel dengan OpenAI, simpan vektor dokumen di pgvector, dan arahkan pengaturan embedding ke endpoint embedding yang kompatibel dengan OpenAI. Image PostgreSQL harus menyertakan ekstensi vector, dan dimensi embedding harus cocok dengan model yang dipilih.
