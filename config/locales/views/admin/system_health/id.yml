          alerts:
            custom_openai:
              title: Pemeriksaan vector store hosted gagal di endpoint kustom ini
              message: Endpoint yang dikonfigurasi tidak lolos pemeriksaan kelangsungan /v1/vector_stores. Sebagian besar endpoint lokal dan yang kompatibel OpenAI tidak mengimplementasikan API tersebut. Chat dan pemrosesan PDF mungkin masih berfungsi; gunakan pgvector dengan endpoint embedding terpisah untuk pengaturan lokal biasa. Kegagalan tercatat di Pengaturan → Debug log dan Rails.logger.
            function_calling_unsupported:
              title: Model tidak mendukung function calling
              message: Endpoint melayani request chat biasa tetapi menolak request yang sama saat membawa parameter tools. Asisten AI membaca akun, transaksi, dan kepemilikan melalui function call, jadi chat terus gagal — sering dengan 404 yang tidak membantu — sampai modelnya mendukung tools. Pilih model yang providernya mendokumentasikan dukungan function calling. Kegagalan tercatat di Pengaturan → Debug log dan Rails.logger.
            function_calling_not_used:
              title: Model menjawab tanpa memanggil tool yang diminta
              message: Endpoint menerima parameter tools, tetapi model menjawab dengan teks alih-alih memanggil health-check tool. Asisten AI tidak bisa membaca data keuangan tanpa tool call, jadi chat mungkin menjawab kosong atau dengan angka karangan. Pilih model yang providernya mendokumentasikan dukungan function calling.
            llm_probe_failed:
              title: Pemeriksaan live LLM gagal
              message: Sure tidak dapat memverifikasi endpoint dan model yang dikonfigurasi. Kegagalan tercatat di Pengaturan → Log debug dan Rails.logger.
            llm_model_not_available:
              title: Model AI yang dikonfigurasi tidak tersedia
              message: Endpoint menjawab, tetapi tidak mendaftar atau melayani model yang dikonfigurasi. Pilih model aktif untuk provider yang dipilih, lalu jalankan pemeriksaan lagi. Untuk Gemini melalui lapisan penerjemah yang kompatibel OpenAI, gunakan model yang didukung saat ini seperti gemini-2.5-flash.
            pdf_text_extraction_failed:
              title: Pemeriksaan ekstraksi teks PDF sintetis gagal
              message: Sure tidak dapat menyelesaikan jalur text-first yang mengekstrak teks PDF tersemat secara lokal lalu mengirimkannya ke model yang dikonfigurasi. Tidak ada data pelanggan yang dikirim. Kegagalan tercatat di Pengaturan → Log debug dan Rails.logger.
            pdf_vision_processing_failed:
              title: Pemeriksaan vision/native PDF sintetis gagal
              message: Sure tidak dapat menyelesaikan jalur PDF gambar atau dokumen asli melalui model yang dikonfigurasi. Tidak ada data pelanggan yang dikirim. Kegagalan tercatat di Pengaturan → Log debug dan Rails.logger.
            vector_probe_failed:
              title: Pemeriksaan live pencarian dokumen gagal
              message: Sure tidak dapat memverifikasi vector store yang dipilih dan setiap layanan embedding yang diperlukan. Kegagalan tercatat di Pengaturan → Log debug dan Rails.logger.
            pgvector_extension_not_enabled:
              title: Ekstensi vektor PostgreSQL tidak diaktifkan
              message: Adapter pgvector dipilih, tetapi PostgreSQL belum mengaktifkan ekstensi vektor untuk database ini. Gunakan image PostgreSQL yang menyertakan pgvector, lalu aktifkan ekstensi sebagai pemilik database atau superuser dan jalankan ulang migrasi dengan VECTOR_STORE_PROVIDER=pgvector.
            pgvector_table_not_found:
              title: Tabel vector_store_chunks hilang
              message: Ekstensi pgvector diaktifkan, tetapi tabel chunks tidak ditemukan. Periksa status migrasi, lalu jalankan ulang migrasi vector store dengan VECTOR_STORE_PROVIDER=pgvector agar Sure bisa membuat vector_store_chunks.
            pgvector_probe_failed:
              title: Pemeriksaan penyimpanan pgvector gagal
              message: Sure tidak dapat mengkueri tabel chunk pgvector. Periksa izin PostgreSQL, ekstensi vector, dan migrasi vector_store_chunks. Kegagalan tercatat di Pengaturan → Log debug dan Rails.logger.
            embedding_dimensions_mismatch:
              title: Dimensi embedding tidak cocok
              message: Endpoint embedding mengembalikan vektor yang panjangnya tidak cocok dengan EMBEDDING_DIMENSIONS. Atur EMBEDDING_MODEL dan EMBEDDING_DIMENSIONS ke ukuran vektor yang terdokumentasi untuk model tersebut, restart Sure agar environment tersimpan, lalu ubah atau buat ulang kolom/tabel embedding pgvector dan tanam ulang dokumen jika data lama menggunakan ukuran berbeda.
            embedding_probe_timeout:
              title: Pemeriksaan live embedding timeout
              message: Endpoint embedding tidak menjawab sebelum AI_HEALTH_PROBE_TIMEOUT. Naikkan timeout pemeriksaan kesehatan tersebut jika provider lambat, lalu restart Sure agar environment tersimpan di setiap proses. Jika panggilan chat AI normal juga timeout, naikkan OPENAI_REQUEST_TIMEOUT secara terpisah.
            embedding_probe_failed:
              title: Pemeriksaan live embedding gagal
              message: Sure tidak dapat membuat embedding uji singkat melalui endpoint dan model yang dikonfigurasi. Periksa EMBEDDING_URI_BASE, EMBEDDING_MODEL, EMBEDDING_ACCESS_TOKEN, dan log penyedia embedding. Kegagalan tercatat di Pengaturan → Log debug dan Rails.logger.
            qdrant:
              title: Dukungan Qdrant belum diimplementasikan
              message: Adapter Qdrant sudah disiapkan kerangkanya, tetapi operasi upload dan pencarian dokumen saat ini gagal. Pilih OpenAI atau pgvector untuk pencarian dokumen.
            missing_vector_store:
              title: Tidak ada vector store yang dikonfigurasi
              message: Dokumen yang diunggah tidak bisa diindeks atau dicari sampai adaptor vector-store dan persyaratannya dikonfigurasi.
            unavailable_vector_store:
              title: Vector store yang dipilih tidak tersedia
              message: Cek persyaratan adapter di bawah. Untuk pgvector, database harus menyediakan ekstensi vector atau tabel vector_store_chunks yang sudah ada.
          llm:
            title: Pemrosesan LLM dan PDF
            description: Pemeriksaan live memverifikasi model yang dikonfigurasi, memintanya melakukan satu function call sederhana seperti yang dilakukan asisten, lalu secara terpisah menguji ekstraksi teks dan pemrosesan vision/native dengan PDF sintetis satu halaman yang tidak berisi data pelanggan. Nilai kredensial tidak pernah ditampilkan.
          vector_store:
