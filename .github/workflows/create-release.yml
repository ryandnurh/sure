name: Create release

# Bikin GitHub Release otomatis setiap versi di .sure-version berubah di main,
# supaya popup "Yang baru" selalu ada isinya tanpa langkah manual.
on:
  push:
    branches: [ main ]
    paths:
      - .sure-version

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < .sure-version)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG sudah ada, lewati."
            exit 0
          fi
          PRERELEASE=""
          case "$TAG" in
            *alpha*|*beta*|*rc*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            $PRERELEASE
